<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="estilos/login.css" />
    <link
      rel="shortcut icon"
      href="Materiais/SVG/Prancheta 9.svg"
      type="image/x-icon"
    />
    <script
      src="https://kit.fontawesome.com/678757254a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <a href="index.html" target="_self" rel="prev">
        <img src="Materiais/SVG/Prancheta 10.svg" alt="" />
      </a>
    </header>
    <main>
      <div class="container">
        <div class="form-box login">
          <form id="form-login">
            <h1>Login</h1>
            <div class="input-box">
              <input
                type="email"
                name="email"
                id="iemail"
                placeholder="Email"
                required
              />
              <i class="fa-regular fa-user"></i>
            </div>
            <div class="input-box">
              <input
                type="password"
                name="pass"
                id="ipass"
                placeholder="Password"
                required
              />
              <i class="fa-solid fa-lock"></i>
            </div>
            <button type="submit" class="btn">Login</button>
          </form>
        </div>
        <div class="form-box register">
          <form id="form-register">
            <h1>Registration</h1>
            <div class="input-box">
              <input
                type="text"
                name="text"
                id="irname"
                placeholder="Username"
                required
              />
              <i class="fa-regular fa-user"></i>
            </div>
            <div class="input-box">
              <input
                type="email"
                name="email"
                id="iremail"
                placeholder="Email"
                required
              />
              <i class="fa-solid fa-envelope"></i>
            </div>
            <div class="input-box">
              <input
                type="password"
                name="pass"
                id="irpass"
                placeholder="Password"
                required
              />
              <i class="fa-solid fa-lock"></i>
            </div>
            <button type="submit" class="btn">Register</button>
          </form>
        </div>

        <div class="toggle-box">
          <div class="toggle-panel toggle-left">
            <h1>Hello, Welcome!</h1>
            <p>Don't have an account?</p>
            <button class="btn register-btn">Register</button>
          </div>
          <div class="toggle-panel toggle-right">
            <h1>Welcome Back!</h1>
            <p>Already have an account?</p>
            <button class="btn login-btn">Login</button>
          </div>
        </div>
      </div>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
