<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AITTO</title>
    <link rel="stylesheet" href="estilos/global.css" />
    <link rel="stylesheet" href="estilos/contact.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=send"
    />
  </head>
  <body>
    <div id="page">
      <header>
        <div class="logo">
          <img src="Logo/4x/Prancheta 4.png" alt="AITTO" />
        </div>
        <menu id="itens">
          <span id="icon-close-menu" onclick="clickMenu()">x</span>
          <a href="OurWork.html">Our Works</a>
          <a href="Contact.html">Contact us</a>
        </menu>
        <span
          id="icon-menu"
          class="material-symbols-outlined"
          onclick="clickMenu()"
          >menu
        </span>
      </header>
      <main>
        <section id="messages">
        </section>
        <section id="teclado">
          <form id="form-teclado">
            <textarea name="iMessage" rows="1" id="iMessage"></textarea>
            <button class="btn" type="submit">
              <span class="material-symbols-outlined send">send</span>
            </button>
          </form>
        </section>
      </main>
    </div>

    <script src="js/Chat.js"></script>

</html>
